name: rpg-media
services:
  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY in backend/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY in backend/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 12
  media-init:
    build:
      context: backend
      dockerfile: Dockerfile.media-init
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://127.0.0.1:9000/rpg-media
      S3_REGION: us-east-1
      S3_BUCKET: rpg-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
volumes:
  minio-data:
